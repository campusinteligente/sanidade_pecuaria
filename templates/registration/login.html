{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Gestão Sanitária e Alimentar</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
  {% include "_icons.html" %}

  <div class="login-card">
    <div class="login-card__brand">
      <svg class="icon" style="width:28px; height:28px;"><use href="#icon-shield"/></svg>
      <span>Gestão Pecuária</span>
    </div>
    <p class="login-card__subtitle">Sistema de Gestão Sanitária e Alimentar</p>

    {% if form.errors %}
      <p class="crud-field__error" style="margin-bottom:12px;">
        Usuário ou senha inválidos. Tente novamente.
      </p>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="crud-field">
        <label for="id_username">Usuário</label>
        {{ form.username }}
      </div>
      <div class="crud-field">
        <label for="id_password">Senha</label>
        {{ form.password }}
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn" style="width:100%; justify-content:center;">
        <svg class="icon"><use href="#icon-check-circle"/></svg> Entrar
      </button>
    </form>
  </div>
</body>
</html>
