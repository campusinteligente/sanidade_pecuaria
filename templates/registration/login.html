{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar · Campus Inteligente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/sanidade.css' %}?v=3">
</head>
<body class="login-body">
  {% include "_icons.html" %}

  <div class="login-card">
    <div class="login-card__header">
      <img class="login-card__logo" width="76" src="{% static 'img/logo-campus-inteligente.png' %}" alt="Programa Campus Inteligente">
      <h1 class="login-card__title">Campus Inteligente</h1>
      <p class="login-card__subtitle">Sistema de Sanidade Pecuária</p>
    </div>

    {% if form.errors %}
      <p class="login-card__error">Usuário ou senha inválidos. Tente novamente.</p>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="login-field">
        <label for="id_username">Usuário</label>
        <div class="login-input">
          <svg class="icon"><use href="#icon-user"/></svg>
          <input type="text" name="username" id="id_username" placeholder="Digite seu usuário"
                 value="{{ form.username.value|default_if_none:'' }}" autocomplete="username" autofocus required>
        </div>
      </div>

      <div class="login-field">
        <label for="id_password">Senha</label>
        <div class="login-input">
          <svg class="icon"><use href="#icon-lock"/></svg>
          <input type="password" name="password" id="id_password" placeholder="Digite sua senha"
                 autocomplete="current-password" required>
          <button type="button" class="login-toggle" id="toggle-senha" aria-label="Mostrar ou ocultar senha">
            <svg class="icon" id="toggle-senha-icon"><use href="#icon-eye"/></svg>
          </button>
        </div>
      </div>

      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn">
        <svg class="icon"><use href="#icon-login"/></svg> Entrar
      </button>
    </form>

    <p class="login-card__footer">© 2026 Campus Inteligente — Sistema de Sanidade Pecuária</p>
  </div>

  <script>
    // Mostrar/ocultar senha
    (function () {
      var campo = document.getElementById('id_password');
      var botao = document.getElementById('toggle-senha');
      var icone = document.querySelector('#toggle-senha-icon use');
      botao.addEventListener('click', function () {
        var mostrando = campo.type === 'text';
        campo.type = mostrando ? 'password' : 'text';
        icone.setAttribute('href', mostrando ? '#icon-eye' : '#icon-eye-off');
      });
    })();
  </script>
</body>
</html>
